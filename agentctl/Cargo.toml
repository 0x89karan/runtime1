[package]
name = "agentctl"
version = "0.67.0"
edition = "2021"

[[bin]]
name = "agentctl"
path = "src/main.rs"

[dependencies]
agentd = { path = "../agentd" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
toml = "0.8"
crossterm = "0.28"
ratatui = { version = "0.29", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
sha2 = "0.10"

[dev-dependencies]
httpmock = "0.7"
