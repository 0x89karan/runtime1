name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build release binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agentd
            agentctl

      - name: Install musl target + tools
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools

      - name: Build agentd (musl)
        run: cargo build --release --target x86_64-unknown-linux-musl
        working-directory: agentd

      - name: Build agentctl (musl)
        run: cargo build --release --target x86_64-unknown-linux-musl
        working-directory: agentctl

      - name: Package artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/agentd  dist/agentd-${TAG}-x86_64-linux-musl
          cp target/x86_64-unknown-linux-musl/release/agentctl dist/agentctl-${TAG}-x86_64-linux-musl
          chmod +x dist/*
          sha256sum dist/* > dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agentd-*
            dist/agentctl-*
            dist/SHA256SUMS
          generate_release_notes: true
