name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agentd

      - name: Build (debug)
        run: cargo build --verbose
        working-directory: agentd

      - name: Build (release)
        run: cargo build --release --verbose
        working-directory: agentd

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: agentd

      - name: Test
        run: cargo test --verbose
        working-directory: agentd

      - name: Install musl target + tools
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools

      - name: Build static musl binary
        run: cargo build --release --target x86_64-unknown-linux-musl
        working-directory: agentd

      - name: Binary size guard (≤ 4 MB)
        run: |
          SIZE=$(stat -c %s target/x86_64-unknown-linux-musl/release/agentd)
          echo "agentd musl binary: ${SIZE} bytes"
          [ "${SIZE}" -le 4194304 ] || { echo "ERROR: binary ${SIZE} bytes exceeds 4 MB limit"; exit 1; }
        working-directory: agentd
