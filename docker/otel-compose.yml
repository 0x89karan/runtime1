# docker-compose for local OTLP observability stack
# Usage:
#   docker compose -f docker/otel-compose.yml up -d
#   # Run agentd, then:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 \
#   OTEL_REDACT_PREVIEWS=true \
#   agentos-otel /path/to/flight.jsonl
#   # Open http://localhost:16686 to explore traces in Jaeger

services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP/protobuf
    restart: unless-stopped

  # Optional: OpenTelemetry Collector for fan-out to multiple backends
