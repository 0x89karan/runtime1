# AgentOS agent specification
# Run:        cargo run -- agent.toml
# Watch log:  tail -f flight.jsonl
# Verbosity:  RUST_LOG=debug cargo run -- agent.toml

[agent]
id = "scout"                          # unique identifier for this agent
task = "List the project directory, read Cargo.toml, and summarize what you find."
max_turns = 20                        # inference turns before max_turns_reached
token_budget = 100_000                # cumulative token ceiling (input + output)

[model]
provider = "anthropic"                # inference backend (only "anthropic" in Phase 0)
model = "claude-sonnet-4-6"           # model id passed to the provider API
max_tokens = 4096                     # maximum tokens per inference response

[tools]
native = ["all"]                      # built-in tools: "all" or a list like ["read_file", "list_dir"]

# Attach an MCP server over stdio (uncomment to enable):
# [[tools.mcp_servers]]
# name    = "filesystem"
# command = "npx"
# args    = ["-y", "@modelcontextprotocol/server-filesystem", "."]

# Standard bundled servers (docker/*.py — stdlib only, no install required):
# Paths are relative to agentd/ (where cargo run is invoked).

# shell_exec — run shell commands (30 s default timeout, 120 s max)
# [[tools.mcp_servers]]
# name    = "shell_exec"
# command = "python3"
# args    = ["../docker/shell_mcp.py"]
# capabilities = [
#   { ShellExec = {} },          # suppresses DenySpawn so the server can fork/exec
#   { FsRead  = { prefix = "/workspace" } },
#   { FsWrite = { prefix = "/tmp" } },
# ]

# http_fetch — fetch HTTPS URLs (body capped at 4 MB, no redirect following)
# [[tools.mcp_servers]]
# name    = "http_fetch"
# command = "python3"
# args    = ["../docker/http_mcp.py"]
# capabilities = [{ Net = { hosts = [], ports = [443] } }]

# web_search — Brave Search API (set BRAVE_SEARCH_API_KEY; free tier: brave.com/search/api)
# [[tools.mcp_servers]]
# name    = "web_search"
# command = "python3"
# args    = ["../docker/search_mcp.py"]
# capabilities = [{ Net = { hosts = ["api.search.brave.com"], ports = [443] } }]

# Attach an MCP server over HTTP (Streamable HTTP, MCP spec 2025-03-26):
# [[tools.mcp_servers]]
# name        = "linear"
# url         = "https://mcp.linear.app/mcp"   # find this in the service's MCP docs
# headers_env = { Authorization = "LINEAR_MCP_TOKEN" }
#               # ^ env var NAME (not the value):
#               #   export LINEAR_MCP_TOKEN="Bearer sk-lin-..."
# # Note: OAuth-based servers (e.g. Gmail) require a future auth_provider field.
# # No command/args/isolation/capabilities — HTTP servers are externally isolated.

# Durable key/value store (p5.1+). Defaults shown; uncomment to override.
# [memory]
# store_path = "memory.redb"   # path to the redb file (relative to CWD or absolute)
# enabled    = true            # set to false to skip store open and kv tool registration

# HTTP egress proxy (p7.5b+). Omit section to disable (default).
# When enabled, agentd binds a forwarding proxy and exposes its address at
# /agents/system/egress_addr. Workloads set ANTHROPIC_BASE_URL to that address.
# [egress]
# proxy_addr = "127.0.0.1:9100"   # ":0" → OS assigns a free port

# To use kv / KB tools, list them explicitly (they are NOT included in "all"):
#   [tools]
#   native = ["read_file", "list_dir", "kv_get", "kv_set", "kb_put", "kb_get", "kb_search"]
# KB capabilities go on the AGENT (not [tools] — ToolsConfig rejects unknown keys):
#   [agent]
#   capabilities = [
#     { KbWrite = { segment = "agent:scratch" } },
#     { KbRead  = { segment = "agent:scratch" } },
#   ]
