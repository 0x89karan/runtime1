[package]
name = "agentd"
version = "0.76.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "agentd"
path = "src/main.rs"

[[bin]]
name = "echo-mcp"
path = "tests/fixtures/echo_mcp.rs"

[[bin]]
name = "sandbox-probe"
path = "tests/fixtures/sandbox_probe.rs"

[dependencies]
anyhow = "1"
bytes = "1"
redb = "4.1.0"
surfaces = { path = "../surfaces" }
sandbox = { path = "../sandbox" }
libc = "0.2"
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", features = ["signal"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "signal", "fs", "net"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
async-stream = "0.3.6"

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"

# Release profile is now defined in the workspace root Cargo.toml.
