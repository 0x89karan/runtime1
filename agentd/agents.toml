# AgentOS multi-agent specification (p1.2+)
# Run:        cargo run -- agents.toml
# Watch log:  tail -f flight.jsonl
# Verbosity:  RUST_LOG=debug cargo run -- agents.toml
#
# This demo exercises:
#   - Two concurrent agents with capability grants (p1.4+)
#   - Admission control (global budget + concurrency cap)
#   - Per-agent capability grants (FsRead scoped to the project)
#
# To also exercise MCP-with-sandbox, add an [[tools.mcp_servers]] block:
#   [[tools.mcp_servers]]
#   name = "notes"
#   command = "cat"
#   args = ["/tmp/notes.txt"]
#   capabilities = [{ FsRead = { prefix = "/tmp" } }]
#
# All agents share [model] and [tools].

[model]
provider = "anthropic"
model    = "claude-sonnet-4-6"
max_tokens = 4096

[tools]
native = ["read_file", "list_dir"]

# Admission control (p1.3+):
#   global_token_budget: stop admitting new inferences after this many total tokens.
#   max_concurrent_inferences: max in-flight inference calls (0 = unlimited).
[scheduler]
global_token_budget        = 200_000   # ~$0.05 ceiling for this demo run
max_concurrent_inferences  = 4

# Durable key/value store (p5.1+). Defaults shown; uncomment to override.
# [memory]
# store_path = "memory.redb"   # path to the redb file (relative to CWD or absolute)
# enabled    = true            # set to false to skip store open and kv tool registration

# To use kv / KB tools, add capabilities and explicit native tool names
# (kv_get, kv_set, kb_put, kb_get, kb_search are NOT included in "all"):
#   capabilities = [
#     { KbWrite = { segment = "agent:scratch" } },
#     { KbRead  = { segment = "agent:scratch" } },
#   ]
#   [tools]
#   native = ["read_file", "list_dir", "kv_get", "kv_set", "kb_put", "kb_get", "kb_search"]

[[agents]]
id          = "surveyor"
name        = "Source Surveyor"
description = "Lists and summarises source files in the agentd/src directory."
skills      = ["fs-read", "summarize"]
task        = "List the agentd/src directory and describe every source file in one sentence each."
max_turns   = 10
token_budget = 80_000
priority    = 0
# Least-privilege: this agent may only read the project source tree (p1.4+).
capabilities = [{ FsRead = { prefix = "." } }]

[[agents]]
id          = "analyst"
name        = "Dependency Analyst"
description = "Explains crate dependencies from Cargo.toml."
skills      = ["fs-read", "explain"]
task        = "Read agentd/Cargo.toml and explain what each dependency is used for."
max_turns   = 10
token_budget = 80_000
priority    = 0
# Least-privilege: read-only access to the project tree.
capabilities = [{ FsRead = { prefix = "." } }]
