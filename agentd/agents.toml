# AgentOS memory demo (p5.8+)
# Run:        cargo run -- agents.toml
# Watch log:  tail -f flight.jsonl
#
# This demo exercises the full shared-KB write → search → read flow:
#   grep '"kind":"memory_write"' flight.jsonl    # writer stores a finding
#   grep '"kind":"kb_search"'    flight.jsonl    # reader searches for it
#   grep '"kind":"memory_read"'  flight.jsonl    # reader retrieves the full entry
#
# Segment classes:
#   canon   — operator-seeded at startup; agents cannot write (read-only trust anchor)
#   log     — append-only; each kb_put gets a new monotonic key
#   scratch — last-writer-wins; any KbWrite agent can overwrite
#
# The writer agent stores a finding in "project:research", then spawns a reader
# agent as a child (via spawn_agent).  Spawn requires the Spawn capability.
# The reader retrieves the finding and reports it.

[model]
provider   = "anthropic"
model      = "claude-haiku-4-5-20251001"
max_tokens = 2048

[tools]
# kv_get, kv_set, kb_put, kb_get, kb_search are NOT included in "all"; list them
# explicitly.  spawn_agent / send_message / list_agents must ALSO be listed here —
# the Spawn capability authorises the call but the tool is only registered if named
# (F-15).  spawn_agent additionally still requires the Spawn capability at dispatch.
native = ["kb_put", "kb_get", "kb_search", "mem_remember", "mem_recall", "spawn_agent", "send_message", "list_agents"]

[scheduler]
global_token_budget       = 100_000   # ~$0.02 ceiling for this demo
max_concurrent_inferences = 2

[memory]
store_path = "/run/memory/memory.redb"   # persistent 9p virtfs mount in QEMU distro
enabled    = true

# Operator-seeded canon segment: read-only trust anchor for agents.
[[memory.segments]]
name  = "project:meta"
class = "canon"
seed  = [
  { key = "guidelines", value = "Always cite evidence. Prefer primary sources." },
]

# Scratch segment for ephemeral research findings: any KbWrite agent can update.
[[memory.segments]]
name  = "project:research"
class = "scratch"

[[agents]]
id          = "writer"
name        = "Research Writer"
description = "Stores a research finding in the shared KB, then spawns a reader to verify it."
skills      = ["kb-write", "spawn"]
task        = """
1. Read the operator guidelines from the canon KB segment:
     kb_get(segment="project:meta", key="guidelines")
2. Store a research finding about Rust memory safety to the scratch segment:
     kb_put(segment="project:research", key="rust-ownership", content="Rust's ownership model eliminates use-after-free and double-free bugs at compile time, with zero runtime overhead.")
3. Spawn a child agent named 'reader' with task: "Search the project:research KB segment for findings about Rust memory safety and summarise what you find."
   Grant the child: KbRead capability for segment "project:research".
"""
max_turns    = 8
token_budget = 40_000
# Spawn requires an explicit Spawn capability — omitting it silently denies spawn_agent.
capabilities = [
  { Spawn    = {} },
  { KbWrite  = { segment = "project:research" } },
  { KbRead   = { segment = "project:meta" } },
  { KbRead   = { segment = "project:research" } },
]
