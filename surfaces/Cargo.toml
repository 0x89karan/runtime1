[package]
name = "surfaces"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
# libc is used in agents_fs.rs under any(test, target_os = "linux"):
# tests run on macOS but still need errno constants via process_control_flush.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# PINNED 0.14 — 0.17 changed spawn_mount2 signature incompatibly.
# MUST be linux-gated: fuser-sys build.rs runs `pkg-config --libs fuse`
# which fails on macOS even during `cargo check`.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.14", default-features = false }
