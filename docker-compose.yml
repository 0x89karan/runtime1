networks:
  # cos and agent are segmented onto separate networks (ux.0b-ar-01 fix):
  # cos's management API is unauthenticated, and agent runs arbitrary/
  # web-fetching templates that would otherwise share Compose's single
  # default bridge with cos and could reach cos:7999. See THREAT_MODEL.md §9.2.
  cos-net: {}
  agent-net: {}

services:
  cos:
    image: ${AGENTOS_IMAGE:-agentos:dev}
    build:
      context: .
      target: runtime-full
    # FUSE requires privileged mode (needed for agentctl watch + /agents filesystem)
    privileged: true
    networks: [cos-net]
    # Management API (:7999, unauthenticated) — host loopback ONLY. Never
    # publish bare `7999:7999`; that exposes spawn/inject/approve/deny to the
    # LAN. See THREAT_MODEL.md for the Docker-bridge exposure this accepts.
    ports:
      - "127.0.0.1:7999:7999"
    volumes:
      # Named volume for all runtime state — no repo bind mount, no checkpoint bleed-through
      - cos-data:/data
      # Secrets provisioned by `agentctl auth google` on the Mac host (read-only)
      - ${AGENTOS_SECRETS_DIR:-${HOME}/.agentos-secrets}:/run/secrets:ro
      # Briefs land on the host (cos entrypoint rewrites output prefix to /data/output)
      - ${AGENTOS_OUTPUT_DIR:-${HOME}/.agentos-output}:/data/output
    environment:
      - ANTHROPIC_API_KEY
      # Google OAuth credentials are read from /run/secrets/google.json (the volume above).
      # cos requires /run/secrets/google.json — there is no env-var fallback for this mode.
      # Run once on the Mac host: agentctl auth google --client-id ... --client-secret ...
      # Schedule. TRIGGER_CRON and TRIGGER_INTERVAL are MUTUALLY EXCLUSIVE — cron_mcp.py
      # exits 1 if both are non-empty. Default is the daily cron, because `every 2m` as a
      # default meant a plain `docker compose up cos` ran the full Gmail pipeline 30× in a
      # morning (~4.1M tokens against a 10M/day window) with no indication anything was wrong.
      # Keep the fire time away from 00:00 UTC: the inbox→curator handoff is date-keyed and
      # server-stamped per job, so a cycle straddling UTC midnight fails the brief (cap.2b-ar-01).
      #   daily 08:00 UTC (default)  : docker compose up cos
      #   twice daily                : TRIGGER_CRON="0 8,17 * * *" docker compose up cos
      #   interval, for testing only : TRIGGER_CRON= TRIGGER_INTERVAL="every 2m" docker compose up cos
      # Note the single-dash ${VAR-default}: it substitutes only when VAR is UNSET, so an
      # explicitly empty TRIGGER_CRON= passes through empty and interval mode works.
      - TRIGGER_CRON=${TRIGGER_CRON-0 8 * * *}
      - TRIGGER_INTERVAL=${TRIGGER_INTERVAL-}
      # OpenAI API key — required for semantic KB (email embeddings via text-embedding-3-small).
      - OPENAI_API_KEY
      # Telegram reach (ux.12) — OPTIONAL. Set all three to enable the two-way bridge
      # (brief delivery + approve/deny from your phone). Omit them and cos runs without
      # Telegram (TUI stays canonical). TELEGRAM_STATE_DIR defaults to /data (the cos-data
      # volume) so the getUpdates offset + delivered bindings survive a restart.
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_CHAT_ID
      # AGENTOS_APPROVAL_SECRET gates the approve/deny routes. When set, the sidecar sends it
      # and agentctl must too; when unset, the routes are open (pre-ux.12). Set it whenever
      # TELEGRAM_* is set — the phone-approve path is only safe with the secret.
      - AGENTOS_APPROVAL_SECRET
    depends_on:
      semantic-kb-mcp:
        condition: service_healthy
    command: cos
    stdin_open: true
    tty: true
    sysctls:
      # Send TCP keepalives every 15 s — prevents Docker NAT from silently
      # dropping idle Anthropic API connections during cron wait periods.
      net.ipv4.tcp_keepalive_time: 15
      net.ipv4.tcp_keepalive_intvl: 5
      net.ipv4.tcp_keepalive_probes: 3

  agent:
    image: ${AGENTOS_IMAGE:-agentos:dev}
    build:
      context: .
      target: runtime-full
    # FUSE requires privileged mode (needed for /agents filesystem + agentctl watch)
    privileged: true
    networks: [agent-net]
    # This service's templates (scout, librarian, ...) run untrusted/LLM-driven
    # workloads — on a separate network from `cos` (ux.0b-ar-01) so they can't
    # reach cos's unauthenticated management API. If you enable [management]
    # here too, keep bind_addr=127.0.0.1 (the default) and never publish a
    # port for it. See THREAT_MODEL.md §9.
    volumes:
      - agent-data:/data
      # Secrets provisioned by `agentctl auth google` on the Mac host (read-only)
      - ${AGENTOS_SECRETS_DIR:-${HOME}/.agentos-secrets}:/run/secrets:ro
      # For templates that read files from the host (scout, librarian — uncomment if needed):
      # - ./my-files:/workspace:ro
    # No static port binding — OAuth callback requires --service-ports:
    #   docker compose run --service-ports --rm agent
    environment:
      - ANTHROPIC_API_KEY
      #
      # TEMPLATE_NAME: which template to run. Try "scout" first — no OAuth setup required.
      # Valid values: scout  librarian  librarian-semantic  coordinator  google-agent
      #               cron-agent  watcher  webhook-agent
      # (journaler and memory-custodian require a persistent /run/memory volume — not supported here)
      # (code-aware and langchain-worker require runsc/gVisor — not in this image)
      - TEMPLATE_NAME
      #
      # AGENT_TASK: the task string passed to the agent. Examples by template:
      #   scout:              "Research the latest Rust async runtimes and write a summary"
      #   librarian:          "Organize the notes in /workspace into topics"
      #   librarian-semantic: "Index these docs and let me search them by meaning"
      #   google-agent:       "Summarize my last 5 unread emails"
      #   journaler:          "Write a brief journal entry about today"
      - AGENT_TASK
      #
      # HOME=/data: persists checkpoint/flight files on the named volume across --rm runs.
      # NOTE: agentctl auth google must run on the Mac host (real $HOME), not the container.
      # Token refresh write-back is blocked by the :ro secrets mount (see cred.1-ki-01).
      - HOME=/data
      # Makes template resolution explicit; avoids the 8-level binary-walk heuristic.
      - AGENTOS_REPO_TEMPLATES_DIR=/etc/agentd/templates
      #
      # ── OAuth (google-agent and any OAuth-gated template) ───────────────────
      # Google credentials come from ~/.agentos-secrets/google.json (the :ro volume above).
      # Run once on the Mac host: agentctl auth google --client-id ... --client-secret ...
      # BREAKING (cred.2): OAUTH_CLIENT_ID/SECRET/REFRESH_TOKEN/CALLBACK_PORT env vars
      # removed from this block. Use the secrets file; see CHANGELOG.md [cred.2].
      #
      # ── Web search (scout, librarian) ───────────────────────────────────────
      - BRAVE_SEARCH_API_KEY
      # ── Semantic KB (librarian-semantic) ────────────────────────────────────
      # Required for semantic kb_put / kb_search (OpenAI text-embedding-3-small).
      # librarian-semantic will start but embedding calls will fail without this.
      - OPENAI_API_KEY
      # ── Debug ───────────────────────────────────────────────────────────────
      # DRY_RUN_ONLY=1: print rendered config and exit without running agentd
      - DRY_RUN_ONLY
    command: agent
    stdin_open: true
    tty: true
    # Always-on: depends_on with required: false means agent starts even if
    # semantic-kb-mcp is not running; kb_search/kb_put degrade gracefully without it.
    depends_on:
      semantic-kb-mcp:
        condition: service_started
        required: false
    sysctls:
      net.ipv4.tcp_keepalive_time: 15
      net.ipv4.tcp_keepalive_intvl: 5
      net.ipv4.tcp_keepalive_probes: 3

  # ── Semantic KB sidecar (h8.1 / memory-routing) ──────────────────────────────
  # Always-on for the CoS: stores email bodies as OpenAI text-embedding-3-small vectors
  # in Qdrant. OPENAI_API_KEY is required. Both qdrant and semantic-kb-mcp start
  # unconditionally — there is no profile gate.
  qdrant:
    image: qdrant/qdrant:v1.13.6
    # No profile — always-on for CoS (email body semantic index, memory-routing).
    # On agent-net only: cos talks to qdrant via semantic-kb-mcp, not directly.
    networks: [agent-net]
    volumes:
      - qdrant-data:/qdrant/storage
    # Qdrant is only reachable by services on agent-net — not exposed to the host.
    # qdrant/qdrant's image has no curl/wget/nc; use bash's /dev/tcp for a pure TCP
    # health check instead (confirmed present in the image; curl-based check always
    # failed with "exec: curl: not found" regardless of whether qdrant was healthy).
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  semantic-kb-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile.semantic-kb-mcp
    # No profile — always-on for CoS. On both networks so both cos and agent can reach it:
    # cos (cos-net) → semantic-kb-mcp → qdrant (agent-net); agent (agent-net) → semantic-kb-mcp.
    networks: [cos-net, agent-net]
    environment:
      - OPENAI_API_KEY
      - EMBED_MODEL=${EMBED_MODEL:-text-embedding-3-small}
      - QDRANT_URL=http://qdrant:6333
      - SEMANTIC_MAX_AGE_DAYS=${SEMANTIC_MAX_AGE_DAYS:-30}
      - SEMANTIC_MAX_ENTRIES=${SEMANTIC_MAX_ENTRIES:-10000}
      # Optional inbound auth: set SIDECAR_SECRET to a shared token; the agent service
      # must pass the same value via headers_env = { X-Sidecar-Token = "SIDECAR_SECRET" }
      # in its [[tools.mcp_servers]] config. Leave unset to disable the check (Docker-network
      # isolation is the default trust boundary).
      - SIDECAR_SECRET
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  cos-data:
  agent-data:
  qdrant-data:
