sample_tasks = [
    "Index all Markdown files in /workspace/library and write a table of contents to /workspace/library/INDEX.md.",
    "Search /workspace/library for documents mentioning 'neural networks' and summarize the top 5 results.",
    "Search the web for 'knowledge management systems 2025' and save a summary to /workspace/library/web-research.md.",
    "Fetch https://example.com and save the page content to /workspace/library/fetched.txt.",
]

[template]
name        = "librarian"
description = "Filesystem librarian: reads and writes a sandboxed directory using an MCP server."
showcases   = "per-tool Landlock FS confinement on an MCP subprocess (p3.3) + capability scoping (p4.x)"

[capabilities]
fs_read  = ["/workspace/library"]
fs_write = ["/workspace/library"]
net_ports = [443]
# Mcp grants required for the model to see tools served by each MCP server.
mcp      = [
    { server = "fs",         tools = [] },
    { server = "http_fetch", tools = [] },
    { server = "web_search", tools = [] },
]

[card]
name        = "Librarian"
description = "Reads and writes a file collection inside /workspace/library using the MCP filesystem server."
skills      = ["research", "file-management"]
suggested_caps = [
    { FsRead  = { prefix = "/workspace/library" } },
    { FsWrite = { prefix = "/workspace/library" } },
    { Mcp     = { server = "fs", tools = [] } },
]

# MCP server subprocess sandbox: capabilities below apply to the subprocess,
# NOT to this agent's [capabilities] section which governs the agent process itself.
[[tools.mcp_servers]]
name = "fs"
command = "npx"
args    = ["@modelcontextprotocol/server-filesystem", "/workspace/library"]
capabilities = [
    { FsRead  = { prefix = "/workspace/library" } },
    { FsWrite = { prefix = "/workspace/library" } },
]

# http_fetch — fetch HTTPS URLs for research.
# Path relative to agentd/ (where cargo run is invoked).
[[tools.mcp_servers]]
name    = "http_fetch"
command = "python3"
args    = ["../docker/http_mcp.py"]
capabilities = [{ Net = { hosts = [], ports = [443] } }]

# web_search — search the web via Brave Search API.
# Requires BRAVE_SEARCH_API_KEY env var. Free tier: brave.com/search/api
[[tools.mcp_servers]]
name     = "web_search"
command  = "python3"
args     = ["../docker/search_mcp.py"]
passenv  = ["BRAVE_SEARCH_API_KEY"]
capabilities = [{ Net = { hosts = ["api.search.brave.com"], ports = [443] } }]

[model]
provider   = "anthropic"
model      = "claude-haiku-4-5-20251001"
max_tokens = 4096

[agent]
# Note: static ID — rename before spawning a second copy in the same session.
id           = "librarian"
task         = ""
max_turns    = 20
token_budget = 100000
